info:
  name: signup
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/signup"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "{{password}}",
        "name": "{{name}}"
      }
  auth: inherit

runtime:
  variables:
    - name: email
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
