info:
  name: update
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{route}}/{{shiftId}}"
  body:
    type: json
    data: |-
      {
        "startTime": "{{startTime}}",
        "endTime": "{{endTime}}",
        "paymentAmount": {{paymentAmount}},
        "numberOfWorkers": {{numberOfWorkers}},
        "title": "{{title}}",
        "type": "{{recurrenceActions}}",
        "approvalRequired": {{approvalRequired}},
      }
  auth: inherit

runtime:
  variables:
    - name: approvalRequired
      value: "true"
    - name: title
      value: "{{$randomJobTitle}}"
    - name: numberOfWorkers
      value: "{{$randomAlphaNumeric}}"
    - name: startTime
      value: "{{$isoTimestamp}}"
    - name: endTime
      value: "{{$isoTimestamp}}"
    - name: paymentAmount
      value: "{{$randomAlphaNumeric}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
